## Projektbeschreibung

**RSS-Reader**: Der RSS-Reader ermöglicht es, die RSS-Feeds einer beliebigen Zeitung/Informationsquelle einzulesen und in Kurzform auszugeben. 

> Somit hat man immer die wichtigsten Nachrichten kurz und knapp im Überblick.
